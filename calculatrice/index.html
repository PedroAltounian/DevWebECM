<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Calculatrice</title>
    <link rel = "stylesheet" href = "style.css">
</head>

<body>
    <label id = "countLabel">0</label>

    <div id = "btnContainer">
        <button class = 'buttons' id = "plusBtn"> + </button>
        <button class = 'buttons' id = "minusBtn"> - </button>
        <button class = 'buttons' id = "timesBtn"> * </button>
        <button class = 'buttons' id = "clearBtn"> C </button>
        <br>
        <button class = 'buttons' id = "1Btn"> 1 </button>
        <button class = 'buttons' id = "2Btn"> 2 </button>
        <button class = 'buttons' id = "3Btn"> 3 </button>
        <button class = 'buttons' id = "divBtn"> / </button>
        <br>
        <button class = 'buttons' id = "4Btn"> 4 </button>
        <button class = 'buttons' id = "5Btn"> 5 </button>
        <button class = 'buttons' id = "6Btn"> 6 </button>
        <button class = 'buttons' id = "expBtn"> ^ </button>
        <br>
        <button class = 'buttons' id = "7Btn"> 7 </button>
        <button class = 'buttons' id = "8Btn"> 8 </button>
        <button class = 'buttons' id = "9Btn"> 9 </button>
        <button class = 'buttons' id = "sqrtBtn"> √ </button>
        <br>
        <button class = 'buttons' id = "pmBtn"> ± </button>
        <button class = 'buttons' id = "0Btn"> 0 </button>
        <button class = 'buttons' id = "equalBtn"> = </button>
        <button class = 'buttons' id = "commaBtn"> . </button>

        <br>
    </div>

    <script src = "index.js"></script>

</body>

</html>
